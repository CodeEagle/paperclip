lzc-sdk-version: '0.1'
package: fun.selfstudio.app.migration.paperclip
version: 0.3.1
min_os_version: 1.3.8
name: Paperclip
description: (LazyCat Auto-build) Open-source orchestration for zero-human companies
license: MIT
homepage: https://paperclip.ing
author: paperclipai
application:
  subdomain: paperclip
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://paperclip:3100/
services:
  paperclip:
    image: registry.lazycat.cloud/invokerlaw/codeeagle/paperclip:c0103736b41e5224
    environment:
      - HOST=0.0.0.0
      - PORT=3100
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private
      - BETTER_AUTH_SECRET
      - PAPERCLIP_PUBLIC_URL
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
    binds:
      - /lzcapp/var/data:/paperclip
locales:
  en:
    name: Paperclip
    description: (LazyCat Auto-build) Open-source orchestration for zero-human companies
  zh:
    name: Paperclip
    description: （懒猫微服自动构建）面向零人类公司的开源智能体编排平台
