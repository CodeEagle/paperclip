lzc-sdk-version: '0.1'
package: fun.selfstudio.app.migration.paperclip
version: 0.3.1
min_os_version: 1.3.8
name: Paperclip
description: (LazyCat Auto-build) Open-source orchestration for zero-human companies
license: MIT
homepage: https://paperclip.ing
author: paperclipai
application:
  subdomain: paperclip
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://paperclip:3100/
services:
  paperclip:
    image: registry.lazycat.cloud/invokerlaw/codeeagle/paperclip:9478db74fed3a02d
    depends_on:
      - postgres
    command: >-
      /bin/bash -lc 'mkdir -p /paperclip/instances/default/logs &&
      chown -R 1000:1000 /paperclip;
      for i in $(seq 1 60); do
      node -e "const net=require(\"net\"); const s=net.createConnection({host:\"postgres\",port:5432},()=>{s.end();process.exit(0)}); s.on(\"error\",()=>process.exit(1)); setTimeout(()=>process.exit(1),1000)"
      && break; sleep 2; done;
      exec node --import ./server/node_modules/tsx/dist/loader.mjs server/dist/index.js'
    environment:
      - DATABASE_URL=postgres://paperclip:paperclip@postgres:5432/paperclip
      - HOST=0.0.0.0
      - PORT=3100
      - SERVE_UI=true
      - PAPERCLIP_HOME=/paperclip
      - PAPERCLIP_DEPLOYMENT_MODE=authenticated
      - PAPERCLIP_DEPLOYMENT_EXPOSURE=private
      - BETTER_AUTH_SECRET
      - PAPERCLIP_PUBLIC_URL
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
    binds:
      - /lzcapp/var/data:/paperclip
  postgres:
    image: registry.lazycat.cloud/invokerlaw/library/postgres:d0ff70664cf393ab
    environment:
      - POSTGRES_USER=paperclip
      - POSTGRES_PASSWORD=paperclip
      - POSTGRES_DB=paperclip
    binds:
      - /lzcapp/var/db/paperclip/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 10s
      timeout: 5s
      retries: 10
locales:
  en:
    name: Paperclip
    description: (LazyCat Auto-build) Open-source orchestration for zero-human companies
  zh:
    name: Paperclip
    description: （懒猫微服自动构建）面向零人类公司的开源智能体编排平台
